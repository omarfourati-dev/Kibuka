name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: self-hosted
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-min-32-chars-for-jwt
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.x"
      - name: Lint
        run: cd apps/backend && uv run ruff check .
      - name: Type check
        run: cd apps/backend && uv run mypy src/ --ignore-missing-imports --explicit-package-bases
      - name: Test
        # Ist-Stand 61% — Template-Ziel bleibt 80%, Gate verhindert weiteres Absinken
        run: cd apps/backend && uv run pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=60

  frontend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo type-check lint --filter=@omarsapp/frontend
      - run: pnpm turbo test --filter=@omarsapp/frontend
