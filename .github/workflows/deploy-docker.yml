name: Deploy – kibuka.omarfourati.de

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_DIR: /home/kibuka

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    # workflow_dispatch darf nur vom main-Stand deployen
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync code to deploy directory
        run: |
          mkdir -p $DEPLOY_DIR
          rsync -a --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.env' \
            $GITHUB_WORKSPACE/ $DEPLOY_DIR/

      - name: Ensure Docker network 'web' exists
        run: docker network create web 2>/dev/null || echo "Network 'web' already exists."

      - name: Write .env from GitHub secrets
        run: |
          if [ -z "${{ secrets.SECRET_KEY }}" ] || [ -z "${{ secrets.POSTGRES_PASSWORD }}" ]; then
            echo "::error::GitHub secrets SECRET_KEY und POSTGRES_PASSWORD müssen gesetzt sein."
            exit 1
          fi
          umask 177
          cat > $DEPLOY_DIR/.env <<EOF
          APP_NAME=Kibuka
          APP_URL=https://kibuka.omarfourati.de
          ENVIRONMENT=production
          DEBUG=false
          SECRET_KEY=${{ secrets.SECRET_KEY }}

          POSTGRES_DB=kibuka
          POSTGRES_USER=kibuka
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL=postgresql+asyncpg://kibuka:${{ secrets.POSTGRES_PASSWORD }}@db:5432/kibuka

          REDIS_URL=redis://redis:6379/0
          REDIS_HOST=redis
          REDIS_PORT=6379

          CORS_ORIGINS=["https://kibuka.omarfourati.de"]

          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          GOOGLE_TTS_CREDENTIALS_JSON=${{ secrets.GOOGLE_TTS_CREDENTIALS_JSON }}

          # Self-hosted MinIO: Uploads und Public-URLs laufen über Caddy
          S3_BUCKET=kibuka-assets
          S3_REGION=eu-central-1
          S3_ACCESS_KEY_ID=${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY=${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL=https://kibuka.omarfourati.de
          EOF

      - name: Build images
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose build

      - name: Start services
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose up -d --remove-orphans

      - name: Wait for backend health
        run: |
          echo "Waiting for kibuka-backend to become healthy..."
          for i in $(seq 1 18); do
            status=$(docker inspect --format='{{.State.Health.Status}}' kibuka-backend 2>/dev/null || echo "missing")
            if [ "$status" = "healthy" ]; then
              echo "Backend is healthy."
              exit 0
            fi
            echo "  Attempt $i/18 — status: $status — waiting 10s..."
            sleep 10
          done
          echo "Backend did not become healthy in time."
          docker logs kibuka-backend --tail=80
          exit 1

      - name: Show status
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose ps

      - name: Reload Caddy
        run: docker compose -f /opt/caddy/docker-compose.yml exec caddy caddy reload --config /etc/caddy/Caddyfile
