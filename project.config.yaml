# ================================================
# KIBUKA — Zentrale Konfiguration
# Ändere hier, alles andere passt sich automatisch an.
# Danach ausführen: python scripts/configure.py
# ================================================

app:
  name: "Kibuka"
  slug: "kibuka"
  description: "Täglich neue KI-Kinderbücher in DE, AR, FR, EN"
  domain: "kibuka.app"

docker:
  registry: "ghcr.io/omar"
  backend_image: "kibuka-backend"
  frontend_image: "kibuka-frontend"

kubernetes:
  namespace: "kibuka"
  cluster_name: "kibuka-dev"

ports:
  backend: 8000
  frontend_dev: 5173
  postgres: 5432
  redis: 6379
  k3d_http: 8080
  k3d_https: 8443
  grafana: 3000
  prometheus: 9090

database:
  name: "kibuka_dev"
  user: "kibuka"

github:
  org: "omar"
  repo: "kibuka"
  eas_project_id: ""
