# Produktion — läuft auf dem VPS unter /home/kibuka, hinter Caddy (Netz "web").
# Secrets liegen in /home/kibuka/.env (vom Deploy-rsync ausgenommen).
name: kibuka

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: kibuka-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kibuka}
      POSTGRES_USER: ${POSTGRES_USER:-kibuka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-kibuka} -d ${POSTGRES_DB:-kibuka}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: kibuka-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_network

  # S3-kompatibler Object Storage (SeaweedFS — MinIO-Images sind nicht mehr
  # anonym pullbar). Anonyme Identity darf nur lesen; Writes brauchen die Keys.
  s3:
    image: chrislusf/seaweedfs:3.97
    container_name: kibuka-s3
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3config.json
    configs:
      - source: s3_auth
        target: /etc/seaweedfs/s3config.json
    volumes:
      - s3_data:/data
    healthcheck:
      # weed bindet an die Container-IP, nicht an localhost
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://$(hostname -i):9333/cluster/status || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    # Bewusst NUR app_network: Master/Filer/S3 sind von web-Netz-Nachbarn
    # nicht erreichbar; öffentliche Downloads proxyt das Frontend-nginx.
    networks:
      - app_network

  s3-init:
    image: kibuka-backend:latest
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ["python", "-c"]
    command:
      - |
        import os
        import boto3
        from botocore.config import Config
        client = boto3.client(
            "s3",
            endpoint_url="http://s3:8333",
            aws_access_key_id=os.environ["S3_ACCESS_KEY_ID"],
            aws_secret_access_key=os.environ["S3_SECRET_ACCESS_KEY"],
            region_name="us-east-1",
            config=Config(s3={"addressing_style": "path"}),
        )
        try:
            client.create_bucket(Bucket="kibuka-assets")
            print("kibuka-assets bucket created")
        except (client.exceptions.BucketAlreadyOwnedByYou, client.exceptions.BucketAlreadyExists):
            print("kibuka-assets bucket already exists")
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set in .env}
    restart: "no"
    networks:
      - app_network

  backend:
    build:
      context: apps/backend
      dockerfile: Dockerfile
    image: kibuka-backend:latest
    container_name: kibuka-backend
    command: sh -c "alembic upgrade head && uvicorn src.infrastructure.main:app --host 0.0.0.0 --port 8000 --workers 2"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app_network

  worker:
    image: kibuka-backend:latest
    container_name: kibuka-worker
    command: arq src.workers.arq_worker.WorkerSettings
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app_network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    image: kibuka-frontend:latest
    container_name: kibuka-frontend
    depends_on:
      - backend
      # nginx proxyt /kibuka-assets/ an s3 — der Name muss auflösbar sein
      - s3
    restart: unless-stopped
    networks:
      - app_network
      # "web" ist das servergemeinsame Caddy-Netz — Caddy erreicht kibuka-frontend:80,
      # nginx leitet /api/ intern an backend:8000 weiter.
      - web

networks:
  app_network:
    driver: bridge
  web:
    external: true

volumes:
  db_data:
  redis_data:
  s3_data:

configs:
  s3_auth:
    content: |
      {
        "identities": [
          {
            "name": "kibuka",
            "credentials": [
              {"accessKey": "${S3_ACCESS_KEY_ID}", "secretKey": "${S3_SECRET_ACCESS_KEY}"}
            ],
            "actions": ["Admin", "Read", "Write", "List", "Tagging"]
          },
          {
            "name": "anonymous",
            "actions": ["Read:kibuka-assets"]
          }
        ]
      }
