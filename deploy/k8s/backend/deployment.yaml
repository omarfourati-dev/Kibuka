apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: { { kubernetes.namespace } }
  labels:
    app: backend
    app.kubernetes.io/name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/{{ docker.registry }}/{{ docker.backend_image }}:latest
          ports:
            - containerPort: { { ports.backend } }
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: { { ports.backend } }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: { { ports.backend } }
            initialDelaySeconds: 30
            periodSeconds: 30
