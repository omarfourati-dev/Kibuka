apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: { { kubernetes.namespace } }
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
