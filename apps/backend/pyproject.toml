[project]
name = "kibuka-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  # Web
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  # Database — PostgreSQL + pgvector
  "sqlalchemy>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pgvector>=0.3",
  # Config + Auth
  "pydantic-settings>=2.6",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "authlib>=1.3",
  "httpx>=0.28",
  # Rate Limiting
  "slowapi>=0.1",
  # Email
  "jinja2>=3.1",
  "aiosmtplib>=3.0",
  # Document Parsing (RAG)
  "pypdf>=5.0",
  "python-docx>=1.1",
  # Cache + Queue
  "redis[hiredis]>=5.0",
  "arq>=0.26",
  # AI
  "openai>=1.58",
  "anthropic>=0.42",
  "google-cloud-texttospeech>=2.18",
  "boto3>=1.35",
  "tiktoken>=0.8",
  # Billing
  "stripe>=11.0",
  # Logging + Observability
  "loguru>=0.7",
  "opentelemetry-api>=1.29",
  "opentelemetry-sdk>=1.29",
  "opentelemetry-instrumentation-fastapi>=0.50",
  "opentelemetry-exporter-otlp>=1.29",
  "prometheus-fastapi-instrumentator>=7.0",
  "sentry-sdk[fastapi]>=2.19",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "factory-boy>=3.3",
  "ruff>=0.8",
  "mypy>=1.13",
  "aiosqlite>=0.20",
  "httpx>=0.28",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
