# Nginx configuration for React SPA with security headers, API proxy, and WebSocket support

# Gzip compression
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
gzip_min_length 1000;
gzip_comp_level 6;

# Ursprünglicher Pfad fürs SEO-Rendering. Nicht $uri: try_files leitet intern
# auf /index.html um (danach stünde dort "/index.html"). $request_uri bleibt
# unverändert und noch URL-kodiert; der Query-String wird abgeschnitten.
# SEO-Rendering mit Rückfall: Ist das Backend nicht erreichbar oder antwortet
# mit 5xx, übernimmt der lokale Backup-Server und liefert eine leere Antwort —
# SSI setzt dann die stub-Blöcke aus index.html ein (Standard-Head bzw. leerer
# Body). error_page reicht hier nicht: bei zwei SSI-Subrequests landete nach
# einem Fehler sonst nginx' 502-Fehlerseite im HTML (lokal reproduziert).
upstream kibuka_seo_backend {
    server backend:8000 max_fails=0;
    server 127.0.0.1:8081 backup;
}

server {
    listen 127.0.0.1:8081;
    access_log off;
    return 204;
}

map $request_uri $seo_path {
    "~^(?<seo_p>/[^?]*)" $seo_p;
    default /;
}

server {
    listen 80;
    server_name _;


    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Google AdSense (src/lib/ads.ts): Auto-Anzeigen und Googles Einwilligungsfenster laden Skripte, Frames und
    # Pixel von wechselnden Google-Hosts, deshalb sind HTTPS-Quellen für script/connect/frame erlaubt.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' ws: wss: https:; frame-src https:; frame-ancestors 'none';" always;

    # Health check endpoint (used by Docker/K8s)
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Buch-Assets aus dem internen SeaweedFS — nur lesend (GET schließt HEAD ein).
    # ^~ ist Pflicht: sonst gewinnt die Static-Asset-Regex (\.png$ etc.) und
    # sucht die Bilder im Frontend-Root statt im Objektspeicher.
    location ^~ /kibuka-assets/ {
        limit_except GET {
            deny all;
        }
        proxy_pass http://s3:8333;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # SEO/GEO: Head + lesbarer Inhalt pro Seite, per SSI in index.html
    # eingebunden (nur als Subrequest erreichbar)
    location /__seo/ {
        internal;
        proxy_pass http://kibuka_seo_backend/api/v1/seo/;
        proxy_set_header Host $host;
        # Seiten dürfen nie auf ein hängendes Backend warten
        proxy_connect_timeout 1s;
        proxy_read_timeout 4s;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
    }

    # Dynamisch aus der Datenbank: alle Bücher + Cover
    location = /sitemap.xml {
        proxy_pass http://backend:8000/api/v1/seo/sitemap.xml;
        proxy_set_header Host $host;
    }

    location = /llms.txt {
        proxy_pass http://backend:8000/api/v1/seo/llms.txt;
        proxy_set_header Host $host;
    }

    # Backend API proxy
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # for long AI streaming responses
        proxy_buffering off;       # required for SSE streaming
        proxy_cache off;
    }

    # WebSocket proxy for real-time features
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;  # long-lived WebSocket connections
    }

    # Static asset caching (1 year for versioned assets)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback routing - serve index.html for all non-file requests
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index index.html;
        # index.html enthält SSI-Includes (/__seo/...). Fällt das Backend aus,
        # greift der eingebettete Standard-Head (stub) — nie eine Fehlermeldung.
        ssi on;
        ssi_silent_errors on;
    }
}
